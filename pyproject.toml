[project]
name = "genesis"
version = "0.1.0"
description = "Productivity system for tasks, projects, calendar, contacts, and journal entries."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "streamlit>=1.61.1",
    "typer>=0.27.1",
    "caldav>=1.3.9",
    "pydantic-settings>=2.15.0",
    "radicale>=3.7.8",
    "fastapi>=0.141.1",
    "argon2-cffi>=25.1.0",
    "nltk>=3.10.3",
]

[project.scripts]
genesis = "genesis.cli.app:main"
genesis-api = "genesis.api.cli:main"
genesis-ui = "genesis.cli.app:main_ui"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a real Radicale server (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "responses>=0.26.2",
    "ruff>=0.16.3",
]
